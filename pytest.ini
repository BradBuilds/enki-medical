[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

markers =
    contract: Contract verification tests (v1.0.0 golden vectors)
    contract_future: Future contract vectors (documented, not yet executable)
    db: Database-dependent tests (require ENKI_DB_DSN)

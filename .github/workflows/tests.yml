name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enki
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: enki
        options: >-
          --health-cmd "pg_isready -U enki -d enki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ENKI_DB_DSN: postgresql://enki:ci-only@localhost:5432/enki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Shipped active set verifies (every pinned library matches its hash)
        run: python -c "from pathlib import Path; from core.spine.active_set import load_active_set_strict; load_active_set_strict(Path('active_set_v3.json')); print('active set ok')"
      - name: Test suite (creates its own throwaway keys)
        run: python -m pytest -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o gdu ./cmd/gdu
